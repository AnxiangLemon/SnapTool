name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build SnapTool.exe (MinGW-w64)
        shell: pwsh
        run: |
          .\build.ps1 -RunSelfTest

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTool-win-x64
          path: SnapTool.exe
          if-no-files-found: error

      - name: Extract Release Notes from Tag
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = ((git tag -l --format="%(contents)" "${{ github.ref_name }}") -join "`n").Trim()
          if ($notes) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText((Join-Path $PWD "release_notes.md"), $notes + "`n", $utf8NoBom)
            "has_notes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "body_path=release_notes.md" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_notes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "body_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SnapTool.exe
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
